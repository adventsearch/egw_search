<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGW Scripture Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

    <div class="max-w-4xl mx-auto px-4 py-12" 
         x-data="scriptureSearch()" 
         x-init="loadData()">
        
        <h1 class="text-3xl font-bold mb-6 text-center">EGW Scripture Index</h1>

        <!-- Search Inputs Container -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="md:col-span-2">
                <input type="text" 
                       x-model.debounce.300ms="searchQuery" 
                       placeholder="Search scripture (e.g., 1 Cor or Genesis 3:1)..." 
                       class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-400 shadow-sm">
            </div>
            <div class="md:col-span-1">
                <input type="text" 
                       x-model.debounce.200ms="egwFilter" 
                       placeholder="Filter EGW (e.g., GC, AA)..." 
                       class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-400 shadow-sm">
            </div>
        </div>

        <!-- Loading State -->
        <div x-show="loading" class="text-center py-8 text-slate-400">
            Loading and optimizing scripture database...
        </div>

        <!-- Results Info -->
        <div x-show="!loading" class="mb-4 text-sm text-slate-400 flex justify-between items-center">
            <span x-text="`Showing up to ${filteredResults.length} matching entries`"></span>
        </div>

        <!-- Results List -->
        <div class="space-y-3" x-show="!loading">
            <template x-for="item in filteredResults" :key="item.id || item.bible">
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-lg shadow hover:border-slate-600 transition flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <span class="font-semibold text-indigo-400 whitespace-nowrap" x-text="item.bible"></span>
                    
                   <!-- Individual Citation Badges as Mobile Links -->
                   <div class="flex flex-wrap gap-1.5 justify-end">
                       <template x-for="cit in getFilteredCitations(item)">
                           <a :href="`https://m.egwwritings.org/en/search?query=${encodeURIComponent(cit).replace(/%20/g, '+')}`" 
                              target="_blank" 
                              rel="noopener noreferrer"
                              class="bg-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded font-mono hover:bg-indigo-600 hover:text-white transition"
                              :class="{'bg-indigo-900/80 text-indigo-200 border border-indigo-500': isHighlighted(cit)}"
                              x-text="cit"></a>
                       </template>
                   </div>
                </div>
            </template>
            
            <!-- Empty State -->
            <div x-show="filteredResults.length === 0 && !loading" class="text-center py-12 text-slate-500 bg-slate-800/50 rounded-lg border border-slate-800">
                No matching scripture references found.
            </div>
        </div>

    </div>

<script>
    function scriptureSearch() {
        return {
            records: [],
            searchQuery: '',
            egwFilter: '',
            loading: true,

            async loadData() {
                try {
                    const response = await fetch('egw_scrip_processed.json');
                    const rawData = await response.json();
                    
                    this.records = rawData.map(item => {
                        let expandedParts = [];
                        
                        if (item.citation) {
                            const rawParts = item.citation.split(';').map(c => c.trim()).filter(Boolean);
                            rawParts.forEach(part => {
                                const firstDigitMatch = part.match(/\d/);
                                if (!firstDigitMatch) {
                                    expandedParts.push(part);
                                    return;
                                }
                                
                                const digitIdx = firstDigitMatch.index;
                                const prefix = part.substring(0, digitIdx).trim();
                                const rest = part.substring(digitIdx);
                                
                                const tokens = rest.split(',').map(t => t.trim()).filter(Boolean);
                                tokens.forEach((token, idx) => {
                                    if (idx === 0 || /^\d/.test(token)) {
                                        expandedParts.push(`${prefix} ${token}`);
                                    } else {
                                        expandedParts.push(`${prefix}, ${token}`);
                                    }
                                });
                            });
                        }
                        
                        const bibleStr = item.bible || '';
                        const searchTxt = item.search_text || '';

                        return {
                            ...item,
                            expandedCitations: expandedParts,
                            searchStr: searchTxt.toLowerCase(),
                            bibleStr: bibleStr.toLowerCase(),
                            // Pre-compute normalized versions (no spaces/punctuation) for foolproof matching
                            normSearchStr: searchTxt.toLowerCase().replace(/[^a-z0-9]/g, ''),
                            normBible: bibleStr.toLowerCase().replace(/[^a-z0-9]/g, ''),
                            normExpandedCitations: expandedParts.map(cit => cit.toLowerCase().replace(/[^a-z0-9]/g, ''))
                        };
                    });
                    
                } catch (error) {
                    console.error('Failed to load JSON data:', error);
                } finally {
                    this.loading = false;
                }
            },

            getFilteredCitations(item) {
                const filterVal = this.egwFilter.trim().toUpperCase();
                if (!filterVal) return item.expandedCitations;
                return item.expandedCitations.filter(p => p.toUpperCase().includes(filterVal));
            },

            isHighlighted(cit) {
                const filterVal = this.egwFilter.trim().toUpperCase();
                if (!filterVal) return false;
                return cit.toUpperCase().includes(filterVal);
            },

            get filteredResults() {
                const sQuery = this.searchQuery.trim().toLowerCase();
                const eFilter = this.egwFilter.trim().toUpperCase();

                if (!sQuery && !eFilter) {
                    return this.records.slice(0, 50);
                }

                let results = this.records;

                if (sQuery) {
                    const cleanQuery = sQuery.replace(/[^a-z0-9]/g, '');
                    results = results.filter(item => {
                        const matchesMain = item.normSearchStr.startsWith(cleanQuery) || item.normBible.startsWith(cleanQuery);
                        const matchesCitations = item.normExpandedCitations.some(cit => cit.startsWith(cleanQuery));
                        return matchesMain || matchesCitations;
                    });
                }

                if (eFilter) {
                    results = results.filter(item => {
                        return item.expandedCitations.some(p => p.toUpperCase().includes(eFilter));
                    });
                }

                return results.slice(0, 50);
            }
        }
    }
</script>
</body>
</html>
