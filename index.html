<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EGW Scripture Index Search</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 0 20px; 
            background-color: #121212; 
            color: #e0e0e0; 
        }
        h1 { color: #ffffff; }
        input { 
            width: 100%; 
            padding: 12px; 
            font-size: 1rem; 
            box-sizing: border-box; 
            background-color: #1e1e1e; 
            border: 1px solid #333; 
            color: #ffffff; 
            border-radius: 4px;
        }
        input::placeholder { color: #888; }
        .citation-link { 
            display: inline-block; 
            margin-right: 10px; 
            margin-bottom: 5px; 
            color: #64b5f6; 
            text-decoration: none; 
        }
        .citation-link:hover { text-decoration: underline; }
        .chapter-block { 
            margin-top: 15px; 
            border-bottom: 1px solid #333; 
            padding-bottom: 10px; 
        }
        h3 { color: #90caf9; }
    </style>
</head>
<body>
    <div id="app">
        <h1>EGW Scripture Index Search</h1>
        <input type="text" v-model="searchQuery" placeholder="Try '2 chron 3', '2 kings 3', '1 cor 13:3', 'jude', etc...">
        
        <div v-if="results.length">
            <div v-for="res in results" class="chapter-block">
                <h3>{{ res.chapterName }} (Verse {{ res.verse }})</h3>
                <div>
                    <a v-for="cit in res.citations" 
                       :href="`https://m.egwwritings.org/en/search?query=${encodeURIComponent(cleanCitation(cit)).replace(/%20/g, '+')}`" 
                       target="_blank" 
                       class="citation-link">
                        {{ cit }};
                    </a>
                </div>
            </div>
        </div>
        <p v-else-if="searchQuery" style="color: #aaa;">No matching results found.</p>
    </div>

    <script>
        const bookAliases = {
            "gen": "Genesis", "genesis": "Genesis",
            "ex": "Exodus", "exo": "Exodus", "exodus": "Exodus",
            "lev": "Leviticus", "leviticus": "Leviticus",
            "num": "Numbers", "numbers": "Numbers",
            "deut": "Deuteronomy", "deu": "Deuteronomy", "deuteronomy": "Deuteronomy",
            "josh": "Joshua", "joshua": "Joshua",
            "judg": "Judges", "judges": "Judges",
            "ruth": "Ruth",
            "1sam": "1 Samuel", "1 sam": "1 Samuel", "1 sa": "1 Samuel", "1 samuel": "1 Samuel",
            "2sam": "2 Samuel", "2 sam": "2 Samuel", "2 sa": "2 Samuel", "2 samuel": "2 Samuel",
            "1kings": "1 Kings", "1 kings": "1 Kings", "1 ki": "1 Kings",
            "2kings": "2 Kings", "2 kings": "2 Kings", "2 ki": "2 Kings",
            "1chron": "1 Chronicles", "1 chron": "1 Chronicles", "1 ch": "1 Chronicles", "1 chronicles": "1 Chronicles",
            "2chron": "2 Chronicles", "2 chron": "2 Chronicles", "2 ch": "2 Chronicles", "2 chronicles": "2 Chronicles",
            "ezra": "Ezra",
            "neh": "Nehemiah", "nehemiah": "Nehemiah",
            "esth": "Esther", "esther": "Esther",
            "job": "Job",
            "ps": "Psalms", "psa": "Psalms", "psalms": "Psalms",
            "prov": "Proverbs", "pro": "Proverbs", "proverbs": "Proverbs",
            "eccl": "Ecclesiastes", "ecc": "Ecclesiastes", "ecclesiastes": "Ecclesiastes",
            "song": "Song of Solomon", "sos": "Song of Solomon", "song of solomon": "Song of Solomon",
            "isa": "Isaiah", "isaiah": "Isaiah",
            "jer": "Jeremiah", "jeremiah": "Jeremiah",
            "lam": "Lamentations", "lamentations": "Lamentations",
            "ezek": "Ezekiel", "eze": "Ezekiel", "ezekiel": "Ezekiel",
            "dan": "Daniel", "daniel": "Daniel",
            "hos": "Hosea", "hosea": "Hosea",
            "joel": "Joel",
            "amos": "Amos",
            "obad": "Obadiah", "obadiah": "Obadiah",
            "jonah": "Jonah",
            "mic": "Micah", "micah": "Micah",
            "nah": "Nahum", "nahum": "Nahum",
            "hab": "Habakkuk", "habakkuk": "Habakkuk",
            "zeph": "Zephaniah", "zep": "Zephaniah", "zephaniah": "Zephaniah",
            "hag": "Haggai", "haggai": "Haggai",
            "zech": "Zechariah", "zec": "Zechariah", "zechariah": "Zechariah",
            "mal": "Malachi", "malachi": "Malachi",
            "matt": "Matthew", "mat": "Matthew", "matthew": "Matthew",
            "mark": "Mark", "mar": "Mark",
            "luke": "Luke", "luk": "Luke",
            "john": "John", "joh": "John",
            "acts": "Acts",
            "rom": "Romans", "romans": "Romans",
            "1cor": "1 Corinthians", "1 cor": "1 Corinthians", "1 co": "1 Corinthians", "1 corinthians": "1 Corinthians",
            "2cor": "2 Corinthians", "2 cor": "2 Corinthians", "2 co": "2 Corinthians", "2 corinthians": "2 Corinthians",
            "gal": "Galatians", "galatians": "Galatians",
            "eph": "Ephesians", "ephesians": "Ephesians",
            "phil": "Philippians", "php": "Philippians", "philippians": "Philippians",
            "col": "Colossians", "colossians": "Colossians",
            "1thess": "1 Thessalonians", "1 thess": "1 Thessalonians", "1 th": "1 Thessalonians", "1 thessalonians": "1 Thessalonians",
            "2thess": "2 Thessalonians", "2 thess": "2 Thessalonians", "2 th": "2 Thessalonians", "2 thessalonians": "2 Thessalonians",
            "1tim": "1 Timothy", "1 tim": "1 Timothy", "1 ti": "1 Timothy", "1 timothy": "1 Timothy",
            "2tim": "2 Timothy", "2 tim": "2 Timothy", "2 ti": "2 Timothy", "2 timothy": "2 Timothy",
            "titus": "Titus", "tit": "Titus",
            "phlm": "Philemon", "phm": "Philemon", "phlib": "Philemon",
            "heb": "Hebrews", "hebrews": "Hebrews",
            "james": "James", "jas": "James",
            "1pet": "1 Peter", "1 pet": "1 Peter", "1 pe": "1 Peter", "1 peter": "1 Peter",
            "2pet": "2 Peter", "2 pet": "2 Peter", "2 pe": "2 Peter", "2 peter": "2 Peter",
            "1john": "1 John", "1 john": "1 John", "1 jn": "1 John",
            "2john": "2 John", "2 john": "2 John", "2 jn": "2 John",
            "3john": "3 John", "3 john": "3 John", "3 jn": "3 John",
            "jude": "Jude",
            "rev": "Revelation", "revelation": "Revelation"
        };

        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const searchData = ref({});
                const searchQuery = ref('');

                onMounted(async () => {
                    const res = await fetch('egwsearch_structured.json');
                    searchData.value = await res.json();
                });

                function cleanCitation(cit) {
                    return cit.replace(/,\s*par\.\s*\d+/gi, '').trim();
                }

                const results = computed(() => {
                    const q = searchQuery.value.trim().toLowerCase().replace(/\s+/g, ' ');
                    if (!q) return [];

                    // Sort aliases by length descending so multi-word/numbered book prefixes match first
                    const sortedAliases = Object.keys(bookAliases).sort((a, b) => b.length - a.length);

                    for (const alias of sortedAliases) {
                        if (q === alias || q.startsWith(alias + ' ')) {
                            const resolvedBook = bookAliases[alias];
                            const remainder = q.slice(alias.length).trim();
                            const bookData = searchData.value[resolvedBook];
                            if (!bookData) return [];

                            // Case A: Whole book request (e.g., "jude")
                            if (!remainder) {
                                let output = [];
                                for (const [chapterKey, chapterData] of Object.entries(bookData)) {
                                    for (const [verse, citations] of Object.entries(chapterData)) {
                                        output.push({ chapterName: chapterKey, verse: verse, citations: citations });
                                    }
                                }
                                return output;
                            }

                            // Case B: Verse request (e.g., "3:3")
                            const verseMatch = remainder.match(/^(\d+)\s*:\s*(\d+)$/);
                            if (verseMatch) {
                                const chapterNum = verseMatch[1];
                                const verseNum = verseMatch[2];
                                const targetChapterKey = `${resolvedBook} ${chapterNum}`;
                                const chapterData = bookData[targetChapterKey];
                                if (!chapterData || !chapterData[verseNum]) return [];

                                return [{
                                    chapterName: targetChapterKey,
                                    verse: verseNum,
                                    citations: chapterData[verseNum]
                                }];
                            }

                            // Case C: Chapter request (e.g., "3")
                            const chapterMatch = remainder.match(/^(\d+)$/);
                            if (chapterMatch) {
                                const chapterNum = chapterMatch[1];
                                const targetChapterKey = `${resolvedBook} ${chapterNum}`;
                                const chapterData = bookData[targetChapterKey];
                                if (!chapterData) return [];

                                let output = [];
                                for (const [verse, citations] of Object.entries(chapterData)) {
                                    output.push({ chapterName: targetChapterKey, verse: verse, citations: citations });
                                }
                                return output;
                            }
                        }
                    }

                    return [];
                });

                return { searchQuery, results, cleanCitation };
            }
        }).mount('#app');
    </script>
</body>
</html>
